name: Scrape & Deploy

on:
  # Run daily at 06:00 UTC
  schedule:
    - cron: "0 6 * * *"
  # Trigger on pushes to main
  push:
    branches:
      - main
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write   # needed to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Install package
        run: .venv/bin/pip install -e . --no-deps

      - name: Add venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      # Carry the event database over from the previous run. Scrapers upsert
      # into it and only past events are ever deleted, so a venue that fails or
      # gets bot-blocked today keeps the events we already know about instead of
      # dropping off the site entirely.
      - name: Restore event database
        uses: actions/cache/restore@v5
        with:
          path: data
          # Cache entries are immutable, so the key has to be unique per run and
          # the prefix match is what actually restores yesterday's database.
          key: events-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            events-db-

      - name: Scrape venues & generate site
        run: cv run
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}

      - name: Save event database
        uses: actions/cache/save@v5
        with:
          path: data
          key: events-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./output
          branch: gh-pages
          single-commit: true       # keep gh-pages history clean
